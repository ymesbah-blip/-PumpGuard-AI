[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpguard-ai"
version = "0.1.0"
description = "Educational synthetic vibration monitoring prototype for centrifugal-pump research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]
