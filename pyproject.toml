[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpguard-ai"
dynamic = ["version"]
description = "Educational, open-source vibration-monitoring toolkit for centrifugal-pump research (synthetic data, transparent features)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PumpGuard AI contributors" }]
keywords = [
  "condition-monitoring",
  "predictive-maintenance",
  "vibration-analysis",
  "centrifugal-pump",
  "bearing-fault",
  "envelope-analysis",
  "digital-twin",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "mypy>=1.8",
  "pre-commit>=3.5",
  "build>=1.0",
]

[project.scripts]
pumpguard = "pumpguard.cli:main"

[project.urls]
Homepage = "https://github.com/ymesbah-blip/-PumpGuard-AI"
Repository = "https://github.com/ymesbah-blip/-PumpGuard-AI"
Issues = "https://github.com/ymesbah-blip/-PumpGuard-AI/issues"
Changelog = "https://github.com/ymesbah-blip/-PumpGuard-AI/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "pumpguard._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pumpguard = ["py.typed"]

# ---------------------------------------------------------------- tooling ---

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::RuntimeWarning"]
markers = ["slow: longer-running tests (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["pumpguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if __name__ == .__main__.:", "raise SystemExit"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "PT", "C4"]

[tool.mypy]
# Python 3.10 compatibility is enforced by ruff's target-version and the CI test matrix;
# pinning python_version here breaks on recent NumPy stubs.
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*"]
ignore_missing_imports = true
