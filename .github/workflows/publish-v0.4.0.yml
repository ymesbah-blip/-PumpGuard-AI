# One-time v0.4.0 research-preview GitHub release after green main CI.
name: Publish v0.4.0 Research Preview

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

jobs:
  publish-preview:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import ast, pathlib; t=ast.parse(pathlib.Path("src/pumpguard/_version.py").read_text()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and any(isinstance(x, ast.Name) and x.id == "__version__" for x in n.targets)))')
          if [[ "$VERSION" == "0.4.0" ]]; then echo "eligible=true" >> "$GITHUB_OUTPUT"; else echo "eligible=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build distributable wheel and sdist
        if: steps.version.outputs.eligible == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish versioned GitHub prerelease once
        if: steps.version.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.4.0 already exists; skipping"
            exit 0
          fi
          gh release create v0.4.0 dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "PumpGuard-AI v0.4.0 — Research Preview" \
            --notes-file docs/releases/v0.4.0.md \
            --prerelease
