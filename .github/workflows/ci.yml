name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term --cov-report=xml
      - name: Example script runs
        run: python examples/compare_conditions.py --machines 2 --segments 2 --out outputs/ci_example.png
      - name: Benchmark dry run (synthetic)
        run: pumpguard benchmark --synthetic --n-boot 200 --out outputs/ci_benchmark
      - name: ESP operating-regime example runs
        run: python examples/esp_operating_regime.py --out outputs/ci_esp.png
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Build & smoke-test wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install wheel in a clean venv and run the CLI
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/pumpguard --version
          /tmp/smoke/bin/pumpguard demo --condition bearing_outer --out smoke_out
          /tmp/smoke/bin/python -m pumpguard.demo --condition imbalance --out smoke_out --no-plot
          test -f smoke_out/bearing_outer_signal.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
